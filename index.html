<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2035" />
    <title>IPZStream — IPTV Management Platform</title>
    <style>
      .settings-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px;padding:5px;background:#eef4f8;border:1px solid #e0e9f0;border-radius:8px}.settings-tabs button{height:34px;border:0;border-radius:6px;background:transparent;color:#637b90;padding:0 11px;display:flex;align-items:center;gap:7px;font-size:9px;font-weight:700;cursor:pointer}.settings-tabs button:hover{background:#fff;color:#1e5f8d}.settings-tabs button.active{background:#fff;color:#087fe9;box-shadow:0 2px 7px #173d5c12}.settings-grid-wide{align-items:start}.settings-card label small,.toggle-row small{display:block;margin-top:4px;color:#93a4b3;font-size:8px;font-weight:400;line-height:1.45}.toggle-row>span{display:grid;gap:2px;text-align:left}.toggle-row>span>b{font-size:10px;font-weight:600}.settings-card .muted{margin:0}.settings-card .version-box strong{font-size:13px}@media(max-width:720px){.settings-tabs{overflow:auto;flex-wrap:nowrap}.settings-tabs button{flex:none}.settings-grid-wide{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/auth-guard.js"></script>
  </body>
</html>
